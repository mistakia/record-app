name: Package

# The release path on macOS: the audit gate, the pinned toolchain, the
# universal app, and the packaged smoke on both slices. macOS runner minutes
# are metered, so this runs by hand and on version tags only, never on every
# push. A run by hand, on any ref, builds unsigned and publishes nothing. A
# pushed v* tag is a release: the release gate refuses it before any build
# unless every signing and notarization secret is set, the tag matches
# package.json's version, and the source-offer contact is named. Both the
# release and the smoke's test build are then signed under the hardened
# runtime, the release is notarized, both are smoked, cli/verify-release.sh
# checks the release, and it is published to GitHub Releases. Signing runs
# electron-builder's temporary keychain import, which suits only an ephemeral
# hosted runner, never a self-hosted one.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    # Notarization alone can take half an hour.
    timeout-minutes: 120
    env:
      RELEASE: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - name: Check out Git repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24

      # Fails closed with no secrets set, naming the missing ones.
      - name: Release gate
        if: env.RELEASE == 'true'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: node cli/check-release-gate.ts "$GITHUB_REF_NAME"

      - name: Install bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Download the Electron binary
        run: bun run setup:electron

      # The smoke seeds its data directory with an in-process record-node and
      # makes its test audio with these; the app itself ships its own pinned
      # ffmpeg and fpcalc. gpg verifies the FFmpeg tarball's signature, and
      # Rosetta runs the Intel slice.
      - name: Install test tools and Rosetta
        run: |
          brew install ffmpeg chromaprint gnupg
          sudo softwareupdate --install-rosetta --agree-to-license

      # package:mac and package:prepare run the audit gate and build the
      # toolchain first.
      - name: Package the unsigned builds
        if: env.RELEASE != 'true'
        run: |
          bun run package:mac
          bun run package:mac:test

      # Everything up to electron-builder runs without the secrets: the audit,
      # the toolchain build, the install, and the bundling.
      - name: Build the release
        if: env.RELEASE == 'true'
        run: bun run package:prepare && bunx electron-vite build

      # electron-builder imports the certificate into a temporary keychain,
      # signs with forceCodeSigning (no identity fails the build), and
      # notarizes with the API key, which lives only in the runner's temp
      # directory for this step.
      - name: Sign and notarize the release
        if: env.RELEASE == 'true'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          export APPLE_API_KEY="$RUNNER_TEMP/apple-api-key.p8"
          trap 'rm -f "$APPLE_API_KEY"' EXIT
          (umask 077 && printf '%s' "$APPLE_API_KEY_P8" > "$APPLE_API_KEY")
          unset APPLE_API_KEY_P8
          bunx electron-builder --mac --publish never -c.forceCodeSigning=true

      - name: Build the test build
        if: env.RELEASE == 'true'
        run: RECORD_TEST_BUILD=1 bunx electron-vite build

      # Signed like the release, under the hardened runtime, so the smoke's
      # functional drive (the utility process, native modules, and the bundled
      # tools) runs under the same code-signing rules as the shipped app. It is
      # not notarized and never published.
      - name: Sign the test build
        if: env.RELEASE == 'true'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: bunx electron-builder --mac --publish never -c.forceCodeSigning=true -c.mac.notarize=false -c.directories.output=release-test

      - name: Packaged smoke (Apple Silicon)
        env:
          RECORD_TOOLCHAIN_PREFLIGHT: bypass
        run: bun run smoke:packaged

      - name: Packaged smoke (Intel, under Rosetta)
        env:
          RECORD_TOOLCHAIN_PREFLIGHT: bypass
          RECORD_PACKAGED_ARCH: x86_64
        run: bun run smoke:packaged

      - name: Verify signature, notarization, and staple
        if: env.RELEASE == 'true'
        run: bash cli/verify-release.sh

      - name: Keep the release files
        if: env.RELEASE == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release
          if-no-files-found: error
          retention-days: 7
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/*-mac.yml

  # Only this job can write to the repository, and it holds no signing secret.
  # A version with a prerelease part (1.1.0-beta.1) is published as a GitHub
  # prerelease, which the app's stable update channel never offers.
  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: macos
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Fetch the release files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release
          path: release

      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          prerelease=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" release/* --verify-tag --title "Record ${GITHUB_REF_NAME#v}" --generate-notes "${prerelease[@]}"
