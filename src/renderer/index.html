<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Spec §8.10.4, narrowed: the renderer never talks to the node (main
         does), so connect-src and media-src name no node origin. media-src
         allows blob: for the generated silence that keeps the Media Session
         active (player/media-session.ts). -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src 'self' blob:; connect-src 'self'; object-src 'none'; frame-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <title>Record</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
