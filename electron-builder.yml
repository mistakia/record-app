# Packaging for macOS (spec §8.10.7): one universal app, as a .dmg to install
# and a .zip for updates. The Package workflow signs a release with the
# Developer ID identity in CSC_LINK and notarizes it; package:mac and
# package:mac:test pass -c.mac.identity=null and build it unsigned.
appId: org.record.app
productName: Record
copyright: Copyright © Record contributors

directories:
  output: release
  buildResources: resources

# Main, preload, and the renderer are bundled by electron-vite into out/;
# the runtime dependencies are record-node, which the bundled node runs from
# inside the asar through utilityProcess, and electron-updater.
files:
  - out/**
  - package.json
  - '!node_modules/record-node/{src,test,cli}/**'
  - '!node_modules/**/*.{md,map,d.ts,ts}'
  - '!node_modules/**/{test,tests,__tests__,docs,example,examples}/**'
asar: true

# The pinned ingest tools and their notices (cli/build-toolchain.sh), beside
# the asar so the bundled node can run them; electron-builder signs them with
# the app.
extraResources:
  - from: toolchain/bin
    to: bin
  - from: toolchain/licenses
    to: licenses

npmRebuild: false
nodeGypRebuild: false
buildDependenciesFromSource: false

mac:
  target:
    - target: dmg
      arch: universal
    - target: zip
      arch: universal
  category: public.app-category.music
  icon: resources/icon.png
  # A signed build runs under the hardened runtime with electron-builder's
  # default entitlements: allow-jit, allow-unsigned-executable-memory, and
  # disable-library-validation.
  binaries:
    - Contents/Resources/bin/ffmpeg
    - Contents/Resources/bin/fpcalc
  minimumSystemVersion: '12.0'
  # libp2p's WebRTC transport loads node-datachannel's prebuilt binary when
  # record-node starts, picking @node-datachannel/darwin-<arch> at runtime.
  # Both arch packages are installed (package:mac), so both slices carry
  # both, identical; the universal merge keeps them as they are.
  x64ArchFiles: Contents/Resources/app.asar.unpacked/node_modules/@node-datachannel/**

dmg:
  writeUpdateInfo: false

# Electron's recommended fuse settings (https://www.electronjs.org/docs/latest/tutorial/fuses).
# The bundled node runs through utilityProcess, so RunAsNode can be off.
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  loadBrowserProcessSpecificV8Snapshot: false
  grantFileProtocolExtraPrivileges: false
  # Flipping a fuse breaks the ad-hoc signature; arm64 refuses to launch an
  # app without one, so an unsigned build has it re-applied.
  resetAdHocDarwinSignature: true

# GitHub Releases on v* tags (the Package workflow). electron-builder only
# writes the update feed from this: the channel file beside the .zip
# (latest-mac.yml, or beta-mac.yml for a version like 1.1.0-beta.1), and
# app-update.yml into the app. Every build runs with --publish never; the
# workflow uploads the release itself.
publish:
  provider: github
  owner: mistakia
  repo: record-app
